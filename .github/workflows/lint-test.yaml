name: Lint and Test Charts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uncomitted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Ensure JSON schema is up-to-date from YAML
        run: |
          python3 -c 'import sys, yaml, json; print(json.dumps(yaml.safe_load(sys.stdin), indent=2))' < charts/trustify/values.schema.yaml > charts/trustify/values.schema.json
          
          if ! git diff --quiet; then
            echo "::error::Uncommitted changes (update the JSON schema after making YAML changes)"
            exit 1
          fi

  # The chart refers to the trustify and Kubernetes schemas by `urn:`, which
  # the helm CLI cannot resolve -- it falls back to a permissive schema, so
  # `helm lint` silently does not check those subtrees. This job registers the
  # vendored copies and validates the values files for real.
  values-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Ensure vendored schemas are intact and the chart has no remote $refs
        run: python3 hack/vendor-values-schemas.py --check

      - name: Set up Go
        uses: actions/setup-go@v5.2.0
        with:
          go-version-file: hack/schema-validator/go.mod

      - name: Validate values files against the chart schema
        working-directory: hack/schema-validator
        run: go test ./...

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.22.1

      # Python is required because `ct lint` runs Yamale (https://github.com/23andMe/Yamale) and
      # yamllint (https://github.com/adrienverge/yamllint) which require Python
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: 3.x

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Helm template unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.1
          helm unittest charts/trustify

      - name: Run chart-testing (lint)
        run: ct lint --config .github/ct.yaml --all

  integration-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Test matrix selection
        run: python3 -m unittest discover -s hack/tests
      - name: Resolve latest and the two stable minor image lines
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 hack/kind-matrix.py

  kind-test:
    needs: integration-matrix
    name: Kind (${{ matrix.tag }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.integration-matrix.outputs.matrix) }}
    env:
      TEST_IMAGE: ${{ matrix.image }}
      INIT_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.x'
      - uses: azure/setup-helm@v4.2.0
        with:
          version: v3.22.1
      - uses: helm/chart-testing-action@v2.6.1
        with:
          version: '3.14.0'
      - name: Check native initialization commands
        if: matrix.mode == 'trustd'
        run: |
          for command in provision importers; do
            if ! docker run --rm --entrypoint /usr/local/bin/trustd "$TEST_IMAGE" db "$command" --help; then
              echo "::error::The published latest image must contain trustd db $command (backend PR #2923). Native initialization is not skipped or replaced with psql."
              exit 1
            fi
          done
      - uses: helm/kind-action@v1.12.0
        with:
          version: v0.30.0
          node_image: kindest/node:v1.34.0
          kubectl_version: v1.34.0
          cluster_name: chart-testing
          wait: 120s
      - name: Start Kind ingress provider
        run: |
          docker run --detach --name kind-cloud-provider --network host \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            registry.k8s.io/cloud-provider-kind/cloud-controller-manager:v0.9.0
          kubectl --context kind-chart-testing label nodes --all \
            node.kubernetes.io/exclude-from-external-load-balancers-
          kubectl --context kind-chart-testing create namespace trustify-ci
      - name: Install and test infrastructure with chart-testing
        run: >-
          ct install --config .github/ct-install.yaml
          --charts charts/trustify-infrastructure
          --namespace trustify-ci --release-name infrastructure
      - name: Configure and check Keycloak issuer ingress
        run: python3 hack/kind-ingress.py sso
      # The existing migration pre-install hook mounts the application PVC.
      # Bootstrap it from the chart itself, then let Helm adopt the same resource.
      - name: Prepare storage required by pre-install migration hooks
        run: |
          helm template trustify charts/trustify --namespace trustify-ci \
            --values charts/trustify/ci/kind-values.yaml \
            --show-only templates/services/server/010-PersistentVolumeClaim-storage.yaml \
            | kubectl --context kind-chart-testing -n trustify-ci apply -f -
          kubectl --context kind-chart-testing -n trustify-ci label pvc storage \
            app.kubernetes.io/managed-by=Helm --overwrite
          kubectl --context kind-chart-testing -n trustify-ci annotate pvc storage \
            meta.helm.sh/release-name=trustify meta.helm.sh/release-namespace=trustify-ci --overwrite
      - name: Install application and run Helm smoke tests with chart-testing
        run: |
          extra="--set-string image.fullName=$TEST_IMAGE"
          # Omitting the setting in legacy cases exercises the chart default.
          if [[ "$INIT_MODE" == trustd ]]; then
            extra+=" --set initialization.mode=trustd"
          fi
          ct install --config .github/ct-install.yaml --charts charts/trustify \
            --namespace trustify-ci --release-name trustify --helm-extra-set-args "$extra"
      - name: Check application ingress
        run: |
          kubectl --context kind-chart-testing -n trustify-ci wait pvc/storage \
            --for=jsonpath='{.status.phase}'=Bound --timeout=60s
          python3 hack/kind-ingress.py application
      - name: Collect diagnostics
        if: always()
        run: bash hack/kind-diagnostics.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kind-${{ matrix.tag }}-${{ matrix.mode }}
          path: kind-artifacts/
          if-no-files-found: ignore
      - name: Stop ingress provider
        if: always()
        run: docker rm -f kind-cloud-provider || true
