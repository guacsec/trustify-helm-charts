name: Lint and Test Charts

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  uncomitted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Ensure JSON schema is up-to-date from YAML
        run: |
          python3 -c 'import sys, yaml, json; print(json.dumps(yaml.safe_load(sys.stdin), indent=2))' < charts/trustify/values.schema.yaml > charts/trustify/values.schema.json
          
          if ! git diff --quiet; then
            echo "::error::Uncommitted changes (update the JSON schema after making YAML changes)"
            exit 1
          fi

  # The chart refers to the trustify and Kubernetes schemas by `urn:`, which
  # the helm CLI cannot resolve -- it falls back to a permissive schema, so
  # `helm lint` silently does not check those subtrees. This job registers the
  # vendored copies and validates the values files for real.
  values-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Ensure vendored schemas are intact and the chart has no remote $refs
        run: python3 hack/vendor-values-schemas.py --check

      - name: Set up Go
        uses: actions/setup-go@v5.2.0
        with:
          go-version-file: hack/schema-validator/go.mod

      - name: Validate values files against the chart schema
        working-directory: hack/schema-validator
        run: go test ./...

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.22.1

      # Python is required because `ct lint` runs Yamale (https://github.com/23andMe/Yamale) and
      # yamllint (https://github.com/adrienverge/yamllint) which require Python
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: 3.x

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run chart-testing (lint)
        run: ct lint --config .github/ct.yaml --all
