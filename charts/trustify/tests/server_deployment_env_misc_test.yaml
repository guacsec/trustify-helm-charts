suite: server miscellaneous env vars and configuration
templates:
  - templates/services/server/020-ConfigMap-auth.yaml
  - templates/services/server/030-Deployment.yaml
values:
  - ../values.yaml
  - ../../../values-minikube.yaml
tests:
  - it: should respect global readOnly setting
    template: templates/services/server/030-Deployment.yaml
    set:
      readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTD_READ_ONLY
            value: "true"

  - it: should prefer module-level readOnly over global
    template: templates/services/server/030-Deployment.yaml
    set:
      readOnly: false
      modules.server.readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTD_READ_ONLY
            value: "true"

  - it: should set Rust log filter
    template: templates/services/server/030-Deployment.yaml
    set:
      rust.logFilter: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: debug

  - it: should set Rust backtrace
    template: templates/services/server/030-Deployment.yaml
    set:
      rust:
        backtrace: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_BACKTRACE
            value: "1"

  - it: should set infrastructure port
    template: templates/services/server/030-Deployment.yaml
    set:
      infrastructure.port: 9020
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFRASTRUCTURE_BIND
            value: "[::]:9020"

  - it: should set initialDelaySeconds for probes
    template: templates/services/server/030-Deployment.yaml
    set:
      modules.server.infrastructure.initialDelaySeconds: 30
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 30

