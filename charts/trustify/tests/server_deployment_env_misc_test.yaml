  #   asserts:
  #     - contains:
  #         path: spec.template.spec.containers[0].env
  #         content:
  #           name: HTTP_SERVER_WORKERS
  #           value: "4"

  - it: should set uploadLimit for all upload types
    template: templates/services/server/030-Deployment.yaml
    set:
      modules.server.uploadLimit: 104857600
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTD_SBOM_UPLOAD_LIMIT
            value: "1.048576e+08"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTD_ADVISORY_UPLOAD_LIMIT
            value: "1.048576e+08"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTD_DATASET_ENTRY_LIMIT
            value: "1.048576e+08"

  - it: should set maximumCacheSize
    template: templates/services/server/030-Deployment.yaml
    set:
      modules.server.maximumCacheSize: 1000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTD_MAX_CACHE_SIZE
            value: "1000"

  - it: should include default command and args
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /usr/local/bin/trustd
      - contains:
          path: spec.template.spec.containers[0].args
          content: api

  - it: should expose endpoint port 8080
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 8080
            name: endpoint
            protocol: TCP

  - it: should include infrastructure port
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9010
            name: infra
            protocol: TCP

  - it: should set serviceAccountName when specified
    template: templates/services/server/030-Deployment.yaml
    set:
      modules.server.serviceAccountName: custom-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa

  - it: should include pod annotations
    template: templates/services/server/030-Deployment.yaml
    set:
      modules.server.annotations:
        custom-annotation: value
    asserts:
      - equal:
          path: metadata.annotations["custom-annotation"]
          value: value

  - it: should set resources requests and limits
    template: templates/services/server/030-Deployment.yaml
    set:
      modules.server.resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 2Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 4Gi

