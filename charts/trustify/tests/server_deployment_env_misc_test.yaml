  #         content:
  #           name: custom-volume
  #           mountPath: /custom

  - it: should include affinity configuration
    template: templates/services/server/030-Deployment.yaml
    set:
      modules.server.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: disktype
                    operator: In
                    values:
                      - ssd
    asserts:
      - isNotNull:
          path: spec.template.spec.affinity.nodeAffinity
