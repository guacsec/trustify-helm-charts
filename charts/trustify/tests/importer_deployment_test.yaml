suite: importer proxy env vars
templates:
  - templates/services/importer/030-Deployment.yaml
values:
  - ../values.yaml
  - ../../../values-minikube.yaml
tests:
  - it: should inject all proxy env vars when proxy is configured
    template: templates/services/importer/030-Deployment.yaml
    set:
      proxy.httpProxy: "http://squid:3128"
      proxy.httpsProxy: "http://squid:3128"
      proxy.noProxy: "localhost,127.0.0.1"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTP_PROXY
            value: "http://squid:3128"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: http_proxy
            value: "http://squid:3128"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            value: "http://squid:3128"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: https_proxy
            value: "http://squid:3128"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
            value: "localhost,127.0.0.1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: no_proxy
            value: "localhost,127.0.0.1"

  - it: should omit proxy env vars when proxy is empty
    template: templates/services/importer/030-Deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTP_PROXY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: http_proxy
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: https_proxy
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: no_proxy
          any: true

  - it: should inject importer credential allowlists as comma-separated values
    template: templates/services/importer/030-Deployment.yaml
    set:
      modules.importer.envPrefixes:
        - QUAY_
        - PULP_
      modules.importer.credentialPaths:
        - /run/secrets/quay-credentials
        - /run/secrets/pulp-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMPORTER_ENV_PREFIXES
            value: "QUAY_,PULP_"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMPORTER_CREDENTIAL_PATHS
            value: "/run/secrets/quay-credentials,/run/secrets/pulp-credentials"

  - it: should omit importer credential allowlists when empty by default
    template: templates/services/importer/030-Deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMPORTER_ENV_PREFIXES
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMPORTER_CREDENTIAL_PATHS
          any: true

  - it: should inject only HTTP_PROXY when only httpProxy is set
    template: templates/services/importer/030-Deployment.yaml
    set:
      proxy.httpProxy: "http://squid:3128"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTP_PROXY
            value: "http://squid:3128"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: http_proxy
            value: "http://squid:3128"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: https_proxy
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: no_proxy
          any: true
