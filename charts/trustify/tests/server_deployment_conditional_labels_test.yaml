suite: server conditional rendering and labels
templates:
  - templates/services/server/020-ConfigMap-auth.yaml
  - templates/services/server/030-Deployment.yaml
values:
  - ../values.yaml
  - ../../../values-minikube.yaml
tests:
  - it: should render when server is enabled
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: should not render when server is disabled
    template: templates/services/server/030-Deployment.yaml
    set:
      modules.server.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should include standard Kubernetes labels
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - isNotNull:
          path: metadata.labels
      - isNotNull:
          path: metadata.labels["app.kubernetes.io/name"]
      - isNotNull:
          path: metadata.labels["app.kubernetes.io/instance"]
      - isNotNull:
          path: metadata.labels["app.kubernetes.io/component"]
      - isNotNull:
          path: metadata.labels["app.kubernetes.io/part-of"]

  - it: should set correct metadata name
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: server

  - it: should include selector labels in spec and pod template
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - isNotNull:
          path: spec.selector.matchLabels
      - isNotNull:
          path: spec.template.metadata.labels
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: server

  - it: should include configHash annotation
    template: templates/services/server/030-Deployment.yaml
    asserts:
      - isNotNull:
          path: spec.template.metadata.annotations["configHash/auth"]

  - it: should respect custom partOf value
    template: templates/services/server/030-Deployment.yaml
    set:
      partOf: my-custom-app
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: my-custom-app
