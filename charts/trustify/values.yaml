appDomain: change-me
partOf: trustify
replicas: 1

image:
  name: trustd
  registry: ghcr.io/guacsec
  pullPolicy: IfNotPresent

rust: {}

proxy: {}

readOnly: false

ingress:
  enabled: true

tls: {}

storage: {}

# Applies to database creation and importer configuration jobs.
initialization:
  mode: psql  # psql (legacy PostgreSQL client) or trustd (application image)

# Optional Helm smoke tests; enabled by the Kind CI values only.
tests:
  enabled: false

database: {}

openshift:
  useServiceCa: true

oidc:
  uiScope: ""
  loadUser: true
  clients:
    frontend: {}
    cli:
      clientSecret:

infrastructure:
  port: 9010

metrics:
  enabled: false

tracing:
  enabled: false

collector: {}

modules:
  server:
    enabled: true
    extraEnv: []
    ingress: {}
    image: {}
    infrastructure: {}
    tracing: {}
    metrics: {}
    rust: {}
    cacheTTL: "60sec"
    recommendPatterns: []
    resources:
      requests:
        cpu: 1
        memory: 8Gi

  importer:
    enabled: true
    extraEnv: []
    image: {}
    infrastructure: {}
    tracing: {}
    metrics: {}
    rust: {}
    resources:
      requests:
        cpu: 1
        memory: 8Gi
    concurrency: 1
    envPrefixes: []
    credentialPaths: []
    # readOnly: false
    workingDirectory:
      size: 32Gi

  createDatabase:
    enabled: false
    image: {}

  migrateDatabase:
    enabled: false
    image: {}
    # dataMigrationSkip:
    #   - m0002000_add_sbom_properties
    # dataMigrationSkipAll: false

  createImporters:
    enabled: false
    image: {}
    importers: {}
