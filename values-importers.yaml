$schema: "charts/trustify/values.schema.json"

appDomain: asdf
tracing: {}

modules:
  createImporters:
    enabled: true
    importers:
      redhat-sboms:
        sbom:
          description: All Red Hat SBOMs
          period: 1d
          source: https://security.access.redhat.com/data/sbom/v1/
          keys:
            - https://security.access.redhat.com/data/97f5eac4.txt#77E79ABE93673533ED09EBE2DCE3823597F5EAC4
          disabled: true
          fetchRetries: 50
      redhat-csaf:
        csaf:
          description: All Red Hat CSAF data
          period: 1d
          source: redhat.com
          disabled: true
          fetchRetries: 50
      cve:
        cve:
          description: CVE list v5
          period: 1d
          source: https://github.com/CVEProject/cvelistV5
          disabled: false
      osv-github:
        osv:
          description: GitHub Advisory Database
          period: 1d
          source: https://github.com/github/advisory-database
          path: advisories
          disabled: false
      quay-redhat-user-workloads:
        quay:
          description: SBOMs from konflux image attachments
          period: 1d
          source: quay.io
          namespace: redhat-user-workloads
          disabled: true
          # auth:             # Optional — omit for unauthenticated access.
          #   method:
          #     type: bearer
          #     token:
          #       # The importer pod must expose QUAY_API_TOKEN from a K8s Secret, e.g.:
          #       #   kubectl create secret generic quay-api-token --from-literal=QUAY_API_TOKEN=<token>
          #       # Then mount it via the Deployment's envFrom (or secretKeyRef):
          #       #   envFrom:
          #       #     - secretRef:
          #       #         name: quay-api-token
          #       type: env
          #       value: QUAY_API_TOKEN
          # Inline variant (dev only — stores secret in DB):
          # auth:
          #   method:
          #     type: bearer
          #     token:
          #       type: inline
          #       value: my-token-here
